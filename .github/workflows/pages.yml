name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'for-sowmiya/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: 'Stuck Pages deployment ID to cancel before publishing'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Recover a stuck Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.cancel_deployment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[a-zA-Z0-9-]+$ ]] || exit 1
          gh api --method POST "repos/$REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel"
      - uses: actions/configure-pages@v5
      - name: Build static website
        run: python3 for-sowmiya/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
