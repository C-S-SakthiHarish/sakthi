name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'for-sowmiya/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build static website
        run: python3 for-sowmiya/build_pages.py
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: _publish
      - name: Update publishing branch
        run: |
          rsync -a --delete --exclude=.git _site/ _publish/
          cd _publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish website from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds"
